<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Manager & Full-Stack Developer | Vancouver, BC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <div class="top-bar-content">
                <div class="top-bar-line">KANAKO_TAGA PORTFOLIO 2026</div>
            </div>
            <div class="top-bar-links">
                <a href="https://www.linkedin.com/in/kanako-taga-191363159/" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="https://github.com/kanadev00" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
            </div>
        </div>
    </header>
    <nav class="animate-fade-in delay-1">
        <div class="nav-inner">
            <button class="hamburger" aria-label="Toggle menu">
                <i class="fa-solid fa-bars hamburger-open"></i>
                <i class="fa-solid fa-xmark hamburger-close"></i>
            </button>
            <ul class="nav-menu">
                <li><a href="#projects">Projects</a></li>
                <li><a href="#expertise">Expertise</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </nav>
    <div class="menu-overlay"></div>

    <div id="react-container">
        <!-- The react application will render the HTML here  -->
    </div>

    <script>
        // Hamburger menu toggle
        const hamburger = document.querySelector('.hamburger');
        const navMenu = document.querySelector('.nav-menu');
        const menuOverlay = document.querySelector('.menu-overlay');
        const body = document.body;

        if (hamburger && navMenu && menuOverlay) {
            const toggleMenu = () => {
                hamburger.classList.toggle('active');
                navMenu.classList.toggle('active');
                menuOverlay.classList.toggle('active');
                const isOpen = navMenu.classList.contains('active');
                body.style.overflow = isOpen ? 'hidden' : '';
                document.documentElement.style.overflow = isOpen ? 'hidden' : '';
            };

            const closeMenu = () => {
                hamburger.classList.remove('active');
                navMenu.classList.remove('active');
                menuOverlay.classList.remove('active');
                body.style.overflow = '';
                document.documentElement.style.overflow = '';
            };

            hamburger.addEventListener('click', toggleMenu);

            // Close menu when clicking on a link
            document.querySelectorAll('.nav-menu a').forEach(link => {
                link.addEventListener('click', closeMenu);
            });

            // Close menu when clicking overlay
            menuOverlay.addEventListener('click', closeMenu);
        }

        // Smooth scroll
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        // Intersection Observer for scroll animations (excludes top-bar — controlled by scroll JS)
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        document.addEventListener('DOMContentLoaded', () => {
            const animatedElements = document.querySelectorAll('[class*="animate-"]:not(.top-bar)');
            animatedElements.forEach(el => observer.observe(el));
        });

        // Add hover effect to project cards
        document.querySelectorAll('.project-card').forEach(card => {
            card.addEventListener('mouseenter', function() {
                this.style.transition = 'all 0.3s ease';
            });
        });

        // Top bar scroll show/hide
        const topBar = document.querySelector('.top-bar');
        const SCROLL_THRESHOLD = 80;

        function updateTopBar() {
            const scrollTop = Math.max(0, window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop);
            if (topBar) {
                if (scrollTop > SCROLL_THRESHOLD) {
                    topBar.classList.add('visible');
                } else {
                    topBar.classList.remove('visible');
                }
            }
            // Parallax effect for grid background
            const mainGrid = document.querySelector('.main-grid');
            if (mainGrid) {
                mainGrid.style.backgroundPosition = `0 ${scrollTop * 0.5}px`;
            }
        }

        window.addEventListener('scroll', updateTopBar, { passive: true });
        window.addEventListener('touchend', updateTopBar, { passive: true });
        document.addEventListener('DOMContentLoaded', updateTopBar);
    </script>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" type="module"></script>
</body>
</html>
